<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>3D object renders</title>
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Renders the floating hero objects once, with a transparent background.
// Run by scripts/render-3d/render.mjs; the PNGs become public/img/3d/*.webp.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SIZE = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const IVORY = 0xf4efe7;
const SIENNA = 0xa84d26;
const INK = 0x0f1d2b;

function baseScene() {
  const scene = new THREE.Scene();
  scene.environment = envTex;
  const key = new THREE.DirectionalLight(0xfff1e2, 2.4);
  key.position.set(3, 5, 6);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd9bf, 1.4);
  rim.position.set(-6, 2, -4);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));
  return scene;
}

const glossy = (color, extra = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.22, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08, ...extra });

/* A hemisphere cap pointing along +Y (top) or -Y (bottom). */
function cap(r, top, material) {
  const g = new THREE.SphereGeometry(r, 64, 32, 0, Math.PI * 2, top ? 0 : Math.PI / 2, Math.PI / 2);
  return new THREE.Mesh(g, material);
}

/* Capsule endoscope: ivory body, sienna band, clear dome with lens and LEDs. */
function capsuleCamera() {
  const g = new THREE.Group();
  const r = 1, half = 1.25;
  const body = glossy(IVORY, { roughness: 0.28 });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, half * 2, 96, 1, true), body);
  g.add(cyl);
  const bottom = cap(r, false, body);
  bottom.position.y = -half;
  g.add(bottom);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.004, r * 1.004, 0.18, 96, 1, true), glossy(SIENNA, { roughness: 0.3 }));
  band.position.y = -0.35;
  g.add(band);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(r * 0.985, 0.035, 16, 96), glossy(0xd9d2c6));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = half;
  g.add(rim);
  // inner face behind the dome
  const face = new THREE.Mesh(new THREE.CircleGeometry(r * 0.96, 96), glossy(0x1b2430, { roughness: 0.5 }));
  face.rotation.x = -Math.PI / 2;
  face.position.y = half + 0.02;
  g.add(face);
  // lens
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.22, 64), glossy(0x05080c, { roughness: 0.05, clearcoat: 1 }));
  lens.position.y = half + 0.12;
  g.add(lens);
  const lensGlass = new THREE.Mesh(new THREE.SphereGeometry(0.3, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2.4), new THREE.MeshPhysicalMaterial({ color: 0x2a4a6a, roughness: 0, metalness: 0.2, clearcoat: 1, envMapIntensity: 2 }));
  lensGlass.position.y = half + 0.2;
  g.add(lensGlass);
  // LEDs
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const led = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff3d6, emissiveIntensity: 3 }));
    led.position.set(Math.cos(a) * 0.62, half + 0.08, Math.sin(a) * 0.62);
    g.add(led);
  }
  // clear dome
  const dome = cap(r, true, new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.02, metalness: 0, transmission: 1, thickness: 0.12, ior: 1.45, transparent: true, opacity: 1, clearcoat: 1, envMapIntensity: 1.6 }));
  dome.position.y = half;
  g.add(dome);
  return g;
}

/* Two-tone medicine capsule. */
function pill(colorA, colorB) {
  const g = new THREE.Group();
  const r = 0.55, half = 0.75;
  const a = glossy(colorA), b = glossy(colorB);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r, half, 64, 1, true), a);
  top.position.y = half / 2;
  const topCap = cap(r, true, a); topCap.position.y = half;
  const bot = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.985, r * 0.985, half, 64, 1, true), b);
  bot.position.y = -half / 2;
  const botCap = cap(r * 0.985, false, b); botCap.position.y = -half;
  g.add(top, topCap, bot, botCap);
  return g;
}

/* Round tablet with a score line. */
function tablet() {
  const g = new THREE.Group();
  const m = glossy(0xf7f4ee, { roughness: 0.45, clearcoat: 0.3 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.34, 96), m);
  const capTop = new THREE.Mesh(new THREE.SphereGeometry(1.6, 96, 24, 0, Math.PI * 2, 0, 0.67), m);
  capTop.position.y = 0.17 - 1.6 * Math.cos(0.67);
  const capBot = capTop.clone(); capBot.rotation.x = Math.PI; capBot.position.y = -capTop.position.y;
  g.add(body, capTop, capBot);
  return g;
}

/* Glass bubble (stands in for the reel's ice cubes). */
function bubble(tint) {
  const g = new THREE.Group();
  const glass = new THREE.MeshPhysicalMaterial({ color: tint, roughness: 0.02, metalness: 0, transmission: 1, thickness: 0.35, ior: 1.33, clearcoat: 1, clearcoatRoughness: 0, envMapIntensity: 2.6, iridescence: 0.6, iridescenceIOR: 1.3, iridescenceThicknessRange: [180, 520] });
  g.add(new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), glass));
  return g;
}

/* Rounded glass cube, the closest cousin of the reel's ice. */
function glassCube() {
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5, 8, 8, 8);
  // round the corners by pushing vertices toward a sphere a little
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const s = v.clone().normalize().multiplyScalar(1.05);
    v.lerp(s, 0.18);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0xf2f8ff, roughness: 0.05, transmission: 1, thickness: 1.6, ior: 1.31, clearcoat: 1, clearcoatRoughness: 0, envMapIntensity: 2.8, attenuationColor: new THREE.Color(0xdcebff), attenuationDistance: 2.5 })));
  return g;
}

const makers = {
  'capsule-cam': capsuleCamera,
  'pill-sienna': () => pill(SIENNA, IVORY),
  'pill-ink': () => pill(0x1f3346, 0xe9e3d7),
  tablet,
  bubble: () => bubble(0xfff4ea),
  'glass-cube': glassCube,
};

// bg: null for a transparent render, or a colour for difference matting of glass
window.renderObject = (name, rx, ry, rz, dist = 6, bg = null) => {
  const scene = baseScene();
  if (bg !== null) scene.background = new THREE.Color(bg);
  const obj = makers[name]();
  obj.rotation.set(rx, ry, rz);
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0, dist);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body>
</html>
